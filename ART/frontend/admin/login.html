<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrativo - ART</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark, #1a3a5c) 100%);
    }

    .login-card {
      background: var(--white, #fff);
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo h1 {
      font-size: 2rem;
      font-weight: 900;
      color: var(--primary);
      margin: 0;
      letter-spacing: 2px;
    }

    .login-logo p {
      color: var(--text-secondary, #7f8c8d);
      font-size: 0.85rem;
      margin-top: 6px;
    }

    .login-card .form-group {
      margin-bottom: 20px;
    }

    .login-card label {
      display: block;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .login-card input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--border, #dde1e7);
      border-radius: 10px;
      font-family: 'Lato', sans-serif;
      font-size: 1rem;
      transition: border-color 0.2s;
      box-sizing: border-box;
      outline: none;
    }

    .login-card input:focus {
      border-color: var(--primary);
    }

    .btn-login {
      width: 100%;
      padding: 15px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'Lato', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 8px;
    }

    .btn-login:hover:not(:disabled) {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #loginError {
      display: none;
      background: #fdecea;
      color: #c0392b;
      border: 1px solid #f5c6cb;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.9rem;
      margin-bottom: 16px;
      text-align: center;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: var(--text-secondary, #7f8c8d);
      text-decoration: none;
      font-size: 0.85rem;
    }

    .back-link:hover {
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <h1>ART</h1>
      <p>Panel Administrativo</p>
    </div>

    <div id="loginError"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" autocomplete="username" required placeholder="Ingresa tu usuario">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" required placeholder="Ingresa tu contraseña">
      </div>

      <button type="submit" class="btn-login" id="loginBtn">Iniciar Sesión</button>
    </form>

    <div style="text-align: center; margin-top: 20px;">
      <a href="#" onclick="abrirModalReset()" class="back-link" style="display: inline-block; margin-top: 0;">¿Olvidaste tu contraseña?</a>
    </div>

    <a href="/" class="back-link">← Volver a Reservas</a>
  </div>

  <!-- Modal Reset Contraseña -->
  <div id="modalReset" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
    <div class="modal-content" style="max-width: 400px; width: 95%; background: white; border-radius: 16px; padding: 24px;">
      <div class="modal-header" style="margin-bottom: 20px;">
        <h2 style="margin: 0; color: var(--primary);">Restablecer Contraseña</h2>
        <button class="close-btn" onclick="cerrarModalReset()" style="background: none; border: none; font-size: 24px; cursor: pointer; color: #666;">&times;</button>
      </div>

      <div id="resetAlerta" style="display:none; margin-bottom: 16px;"></div>

      <form id="formReset" onsubmit="solicitarReset(event)">
        <div class="form-group">
          <label for="resetUsername">Usuario</label>
          <input type="text" id="resetUsername" required placeholder="Ingresa tu usuario" style="width: 100%; padding: 14px 16px; border: 1.5px solid var(--border, #dde1e7); border-radius: 10px; font-family: 'Lato', sans-serif; font-size: 1rem; box-sizing: border-box; outline: none;">
        </div>

        <button type="submit" class="btn-login" style="width: 100%; padding: 15px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-family: 'Lato', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 8px;">Enviar Enlace de Restablecimiento</button>
      </form>

      <div style="text-align: center; margin-top: 16px;">
        <button onclick="cerrarModalReset()" style="background: none; border: none; color: var(--primary); cursor: pointer; font-family: 'Lato', sans-serif;">Volver al Login</button>
      </div>
    </div>
  </div>

  <script src="/admin/login.js"></script>
</body>
</html>
