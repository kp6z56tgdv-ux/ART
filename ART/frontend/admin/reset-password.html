<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer Contraseña - ART</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark, #1a3a5c) 100%);
    }

    .reset-card {
      background: var(--white, #fff);
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .reset-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .reset-logo h1 {
      font-size: 2rem;
      font-weight: 900;
      color: var(--primary);
      margin: 0;
      letter-spacing: 2px;
    }

    .reset-logo p {
      color: var(--text-secondary, #7f8c8d);
      font-size: 0.85rem;
      margin-top: 6px;
    }

    .reset-card .form-group {
      margin-bottom: 20px;
    }

    .reset-card label {
      display: block;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .reset-card input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--border, #dde1e7);
      border-radius: 10px;
      font-family: 'Lato', sans-serif;
      font-size: 1rem;
      transition: border-color 0.2s;
      box-sizing: border-box;
      outline: none;
    }

    .reset-card input:focus {
      border-color: var(--primary);
    }

    .btn-reset {
      width: 100%;
      padding: 15px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'Lato', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 8px;
    }

    .btn-reset:hover:not(:disabled) {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-reset:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #resetError, #resetSuccess {
      display: none;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.9rem;
      margin-bottom: 16px;
      text-align: center;
    }

    #resetError {
      background: #fdecea;
      color: #c0392b;
      border: 1px solid #f5c6cb;
    }

    #resetSuccess {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: var(--text-secondary, #7f8c8d);
      text-decoration: none;
      font-size: 0.85rem;
    }

    .back-link:hover {
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="reset-card">
    <div class="reset-logo">
      <h1>ART</h1>
      <p>Restablecer Contraseña</p>
    </div>

    <div id="resetError"></div>
    <div id="resetSuccess"></div>

    <form id="resetForm" onsubmit="handleReset(event)">
      <div class="form-group">
        <label for="password">Nueva Contraseña *</label>
        <input type="password" id="password" autocomplete="new-password" required placeholder="Mínimo 6 caracteres">
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña *</label>
        <input type="password" id="confirmPassword" autocomplete="new-password" required placeholder="Repite la contraseña">
      </div>

      <button type="submit" class="btn-reset" id="resetBtn">Restablecer Contraseña</button>
    </form>

    <a href="/admin/login.html" class="back-link">← Volver al Login</a>
  </div>

  <script>
    // Obtener token de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      document.getElementById('resetError').textContent = 'Token de restablecimiento inválido o faltante';
      document.getElementById('resetError').style.display = 'block';
      document.getElementById('resetForm').style.display = 'none';
    }

    async function handleReset(e) {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('resetBtn');
      const errorDiv = document.getElementById('resetError');
      const successDiv = document.getElementById('resetSuccess');

      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';

      if (password !== confirmPassword) {
        errorDiv.textContent = 'Las contraseñas no coinciden';
        errorDiv.style.display = 'block';
        return;
      }

      if (password.length < 6) {
        errorDiv.textContent = 'La contraseña debe tener al menos 6 caracteres';
        errorDiv.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Restableciendo...';

      try {
        const res = await fetch('/api/auth/reset-password-confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, passwordNuevo: password })
        });

        const data = await res.json();

        if (res.ok) {
          successDiv.textContent = data.message;
          successDiv.style.display = 'block';
          document.getElementById('resetForm').reset();
          setTimeout(() => {
            window.location.href = '/admin/login.html';
          }, 3000);
        } else {
          errorDiv.textContent = data.error || 'Error al restablecer contraseña';
          errorDiv.style.display = 'block';
        }
      } catch {
        errorDiv.textContent = 'Error de conexión. Intenta nuevamente.';
        errorDiv.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Restablecer Contraseña';
      }
    }
  </script>
</body>
</html>
